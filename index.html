/* =========================
   PAYMENT
========================= */

function payNow(){

    /*
    यहां अपना UPI ID डालें।
    उदाहरण:
    yourname@upi
    */

    let upi = "YOUR_UPI_ID@upi";

    /* Course Price = ₹29 */
    let amount = "29";

    let url =
        "upi://pay" +
        "?pa=" + encodeURIComponent(upi) +
        "&pn=" + encodeURIComponent("Smart Course") +
        "&am=" + amount +
        "&cu=INR";

    window.location.href = url;
}


/* =========================
   REDEEM CODE
========================= */

function redeemCode(){

    let code =
        document.getElementById("redeemInput")
        .value
        .trim()
        .toUpperCase();

    let validCodes = [

        "SMART001",
        "SMART002",
        "SMART003",
        "SMART004",
        "SMART005",
        "SMART006",
        "SMART007",
        "SMART008",
        "SMART009",
        "SMART010"

    ];

    if(validCodes.includes(code)){

        localStorage.setItem(
            "smartCourseUnlocked",
            "yes"
        );

        alert("🎉 Course Successfully Unlocked!");

        showCourse();

    }else{

        alert("❌ गलत Redeem Code");

    }
}


/* =========================
   COURSE CHECK
========================= */

function checkCourse(){

    let unlocked =
        localStorage.getItem(
            "smartCourseUnlocked"
        );

    if(unlocked === "yes"){

        showCourse();

    }else{

        document
        .getElementById("lockScreen")
        .classList.remove("hidden");

        document
        .getElementById("courseScreen")
        .classList.add("hidden");

    }
}


/* =========================
   SHOW COURSE
========================= */

function showCourse(){

    document
    .getElementById("lockScreen")
    .classList.add("hidden");

    document
    .getElementById("settingsScreen")
    .classList.add("hidden");

    document
    .getElementById("courseScreen")
    .classList.remove("hidden");

}


/* =========================
   SETTINGS
========================= */

function openSettings(){

    document
    .getElementById("lockScreen")
    .classList.add("hidden");

    document
    .getElementById("courseScreen")
    .classList.add("hidden");

    document
    .getElementById("settingsScreen")
    .classList.remove("hidden");

}


function closeSettings(){

    document
    .getElementById("settingsScreen")
    .classList.add("hidden");

    checkCourse();

}


/* =========================
   LOGOUT
========================= */

function logout(){

    localStorage.removeItem(
        "smartCourseUnlocked"
    );

    alert("आप Logout हो गए हैं।");

    location.reload();

}
